###version: "3.7"
services:
  breedbase:
    image: breedbase/breedbase:latest
    restart: always

    deploy:
      resources:
        reservations:
          memory: 50G
        limits:
          memory: 50G
        
    container_name: breedbase_web_yambase
    ports:
      - 8937:8080
    volumes:
       - type: bind
         source: /home/production/yambase/sgn_local.conf
         target: /home/production/cxgn/sgn/sgn_local.conf
#       - type: bind
 #        source: /home/production/yambase
 #        target: /home/production/cxgn/yambase
       - type: bind
         source: /export/prod/public_yambase
         target: /home/production/volume
       - type: bind
         source: bash_history
         target: /home/production/.bash_history
#       - type: bind
#         source: /home/production/sgn_for_yambase
#         target: /home/production/cxgn/sgn

